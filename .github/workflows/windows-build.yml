name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install pyinstaller PyQt5 pywin32
      - name: Verify task storage and agent bridge
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_app test_agent_bridge test_taskflow_skill test_task_history -v
      - name: Build agent bridge
        run: python build_agent.py
      - name: Build application
        run: python build_exe.py
      - name: Verify frozen application
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath 'dist/TaskFlow.exe' -ArgumentList @('--verify-build', 'build/frozen-verification.json') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen verification process failed' }
          if (-not (Test-Path build/frozen-verification.json)) { throw 'Frozen verification report missing' }
          $result = Get-Content build/frozen-verification.json | ConvertFrom-Json
          if (-not $result.ok) { throw 'Frozen verification failed' }
      - name: Build installer
        run: python build_installer.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Windows
          path: |
            dist/TaskFlow.exe
            dist_agent/TaskFlowAgent.exe
            dist_installer/TaskFlowSetup.exe
      - name: Attach release assets for tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TaskFlow.exe
            dist_agent/TaskFlowAgent.exe
            dist_installer/TaskFlowSetup.exe
